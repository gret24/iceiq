name: Build & Push to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*"]          # v1.0.0 같은 태그 푸시도 트리거
  workflow_dispatch:       # 수동 실행 버튼

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # gret24/iceiq-dev → ghcr.io/gret24/iceiq-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 푸시 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Actions 자동 제공 — 별도 설정 불필요

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # GitHub Actions 캐시 — 재빌드 속도 향상
          cache-to: type=gha,mode=max
